<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thu Uyên bằng trái tim</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100%;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    #message {
      position: absolute;
      top: 68%;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Arial', sans-serif;
      font-size: 36px;
      color: #ea80b0;
      white-space: nowrap;
      z-index: 10;
      letter-spacing: 2px;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="message">🌷 Vợ yêu 20/10 vui vẻ nhá 🌷</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const message = document.getElementById('message');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const heartImage = new Image();
    heartImage.src = 'data:image/svg+xml;base64,' + btoa(`
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30">
        <path fill="#ea80b0" d="M15 27s-13-8.4-13-15.6S8.4 0 15 7.2 28 0 28 11.4 15 27 15 27z"/>
      </svg>
    `);

    const baseHearts = [];
    const flyingHearts = [];

    heartImage.onload = () => {
      drawTextWithHearts("💗 Thu Uyên 💗");
    };

    function drawTextWithHearts(text) {
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = width;
      tempCanvas.height = height;

      tempCtx.fillStyle = 'white';
      tempCtx.font = 'bold 120px Arial';
      tempCtx.textAlign = 'center';
      tempCtx.textBaseline = 'middle';
      tempCtx.fillText(text, width / 2, height / 2);

      const imageData = tempCtx.getImageData(0, 0, width, height).data;

      for (let y = 0; y < height; y += 8) {
        for (let x = 0; x < width; x += 8) {
          const index = (y * width + x) * 4;
          if (imageData[index + 3] > 128) {
            baseHearts.push({ x, y });
          }
        }
      }
    }

    function drawBaseHearts() {
      for (let heart of baseHearts) {
        ctx.globalAlpha = 1;
        ctx.drawImage(heartImage, heart.x, heart.y, 10, 10);
      }
    }

    function createFlyingHearts(count = 500) {
      for (let i = 0; i < count; i++) {
        const source = baseHearts[Math.floor(Math.random() * baseHearts.length)];
        const angle = Math.random() * Math.PI * 2;
        const speed = 30 + Math.random() * 50;
        flyingHearts.push({
          x: source.x,
          y: source.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 10 + Math.random() * 10,
          blinkPhase: Math.random() * Math.PI * 2
        });
      }
    }

    function updateFlyingHearts(dt) {
      for (let heart of flyingHearts) {
        heart.x += heart.vx * dt;
        heart.y += heart.vy * dt;
      }
    }

    function drawFlyingHearts() {
      for (let heart of flyingHearts) {
        let blink = 0.5 + 0.5 * Math.sin(Date.now() / 300 + heart.blinkPhase);
        ctx.globalAlpha = blink;
        ctx.drawImage(heartImage, heart.x, heart.y, heart.size, heart.size);
      }
      ctx.globalAlpha = 1;
    }

    let lastTime = performance.now();
    function animate(time) {
      const dt = (time - lastTime) / 1000;
      lastTime = time;
      ctx.clearRect(0, 0, width, height);
      drawBaseHearts();
      updateFlyingHearts(dt);
      drawFlyingHearts();
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    canvas.addEventListener('click', () => {
      createFlyingHearts(500);
      message.style.display = 'block';
    });
  </script>
</body>
</html>
